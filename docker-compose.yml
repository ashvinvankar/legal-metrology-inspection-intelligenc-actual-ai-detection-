
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (PRD Section 24)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: slm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slm_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-slm_cip_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slm_admin -d slm_cip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Queue & Cache (PRD Section 21 & 22)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: slm_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO S3-Compatible Object Storage (PRD Section 12 & 17)
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: slm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------------------------
  # FastAPI Backend API Tier (PRD Section 22 & 23)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: slm_backend_api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://slm_admin:slm_secure_password@postgres:5432/slm_cip_db
      - DATABASE_URL_SYNC=postgresql://slm_admin:slm_secure_password@postgres:5432/slm_cip_db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_BACKEND=s3
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET_NAME=slm-evidence
      - STORAGE_USE_SSL=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./rules:/app/rules
  # ----------------------------------------------------------------------------
  # Celery AI / CV Pipeline Worker (PRD Section 9, 21, 22)
  # ----------------------------------------------------------------------------
  ai_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: slm_ai_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://slm_admin:slm_secure_password@postgres:5432/slm_cip_db
      - DATABASE_URL_SYNC=postgresql://slm_admin:slm_secure_password@postgres:5432/slm_cip_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_BACKEND=s3
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - USE_REAL_MODELS=false
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend:/app
      - ./rules:/app/rules

  # ----------------------------------------------------------------------------
  # Next.js Frontend Application Tier (PRD Section 21 & 25)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slm_frontend
    restart: unless-stopped
    environment:
      # Browser-visible URL (client-side JS uses this directly via host port mapping)
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      # Server-side URL for SSR/rewrite proxy (Docker internal network)
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  minio_data:
